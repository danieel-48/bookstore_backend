spring.application.name=auth-api
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# Configuracion de base de datos (nube o local)
# Si se define DB_URL tiene precedencia; de lo contrario se construye con DB_HOST, DB_PORT y DB_NAME
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookstore}?useSSL=${DB_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Frontend permitido para CORS (separa por comas si hay varias URLs)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}
